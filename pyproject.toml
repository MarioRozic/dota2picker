[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dota2picker"
version = "0.1.0"
description = "Dota 2 draft counter-pick helper"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "mss>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dota2picker = "dota2picker.__main__:main"

[tool.setuptools.packages.find]
include = ["dota2picker*"]

[tool.setuptools.package-data]
"dota2picker.data" = ["*.json"]
"dota2picker.static" = ["*.html"]
