<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dota2Picker</title>
<style>
  :root { --bg:#14171c; --panel:#1d2128; --line:#2c323c; --text:#e6e8eb; --muted:#8a93a0;
          --good:#5cc87a; --bad:#e2655a; --accent:#d9a441; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--line);
           background:var(--panel); flex-wrap:wrap; }
  header .controls { display:flex; gap:8px; align-items:center; margin-left:auto; flex-wrap:wrap; }
  h1 { font-size:16px; margin:0; }
  .layout { display:grid; grid-template-columns: minmax(260px, 320px) minmax(0, 1fr); gap:16px; padding:12px 16px 32px; }
  aside { min-width:0; }
  section.main { min-width:0; }
  .cols { display:grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap:10px; }
  .col { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; min-width:0; }
  .col.mine { border-color:var(--accent); }
  .col h3 { margin:0 0 4px; font-size:13px; display:flex; align-items:baseline; gap:6px; }
  .col h3 b { font-size:18px; color:var(--accent); }
  .col h3 span { color:var(--muted); font-weight:400; }
  .col .sugg:first-of-type { border-top:0; }
  .phases { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:10px; }
  .phases .phase { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  #avoid { display:grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); column-gap:16px; }
  /* Narrower screens: the draft goes in a strip above the picks so the five columns keep their width. */
  @media (max-width: 1500px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    aside { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); column-gap:16px; align-items:start; }
    aside .search { margin:8px 0; }
  }
  @media (max-width: 1100px) { .cols { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 760px) { .cols { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 480px) { .cols { grid-template-columns: minmax(0, 1fr); } }
  .status { font-size:12px; color:var(--muted); }
  .status.live { color:var(--good); }
  a.status { margin-right:10px; }
  .row { display:flex; gap:8px; margin:10px 0; }
  select, input { background:var(--panel); color:var(--text); border:1px solid var(--line);
                  border-radius:6px; padding:7px 8px; font:inherit; }
  input { width:100%; }
  .search { position:relative; }
  .results { position:absolute; z-index:5; left:0; right:0; background:var(--panel);
             border:1px solid var(--line); border-radius:6px; margin-top:2px; max-height:260px; overflow:auto; }
  .result { display:flex; align-items:center; gap:8px; padding:4px 8px; }
  .result.active { background:#2a303a; }
  .result span { flex:1; }
  .result button { font-size:12px; }
  button { background:#2a303a; color:var(--text); border:1px solid var(--line); border-radius:5px;
           padding:3px 8px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--accent); }
  .team { margin:8px 0; }
  section.main > .team { margin:0 0 16px; }
  .team h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 4px; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; min-height:30px; }
  .chip { display:flex; align-items:center; gap:4px; background:var(--panel); border:1px solid var(--line);
          border-radius:5px; padding:2px 6px 2px 2px; cursor:pointer; font-size:13px; }
  .chip:hover { border-color:var(--bad); }
  .chip.unsure { border-style:dashed; border-color:var(--accent); }
  .chip.me { border-color:var(--accent); background:#2e2a1e; }
  .chip .star { color:var(--muted); padding:0 2px; }
  .chip .star:hover, .chip.me .star { color:var(--accent); }
  .sugg.pickable { cursor:pointer; }
  .sugg.pickable:hover .name { color:var(--accent); }
  img.item { width:44px; height:32px; border-radius:3px; object-fit:cover; background:#000; }
  .cost { margin-left:auto; color:var(--accent); font-variant-numeric:tabular-nums; font-size:13px; }
  .chip.unsure::after { content:"?"; color:var(--accent); font-weight:700; }
  img.icon { width:26px; height:26px; border-radius:3px; object-fit:cover; background:#000; }
  img.portrait { width:64px; height:36px; border-radius:3px; object-fit:cover; background:#000; }
  .sugg { display:grid; grid-template-columns:auto minmax(0, 1fr) auto; column-gap:10px; row-gap:2px; align-items:center;
          padding:8px 0; border-top:1px solid var(--line); }
  .sugg .edges { grid-column:1 / -1; }
  .sugg .name { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sugg .why { font-size:12px; color:var(--muted); }
  .score { font-variant-numeric:tabular-nums; font-weight:600; font-size:15px; }
  .pos { color:var(--good); } .neg { color:var(--bad); }
  .empty { color:var(--muted); font-size:13px; padding:6px 0; }
  .phase { padding:6px 0; border-top:1px solid var(--line); }
  .phase h3 { font-size:12px; font-weight:600; color:var(--muted); margin:0 0 4px; }
  .tiles { display:flex; flex-wrap:wrap; gap:6px; }
  .tile { position:relative; display:flex; flex-direction:column; align-items:center; width:52px; font-size:11px; color:var(--muted); }
  .tile img.item { border:2px solid transparent; }
  .tile.counter img.item { border-color:var(--accent); }
  .tile .n { position:absolute; top:1px; right:5px; background:#000c; color:var(--text); border-radius:3px; padding:0 3px; font-size:11px; }
  .vs { font-size:12px; color:var(--muted); margin-top:4px; }
  .vs b { color:var(--accent); font-weight:600; }
</style>
</head>
<body>
<header>
  <h1>Dota2Picker</h1>
  <div class="controls">
    <select id="bracket" title="Rank bracket for meta win rates"></select>
    <select id="side" title="Which side of the top bar is your team">
      <option value="">Side: auto</option><option value="radiant">Radiant (left)</option><option value="dire">Dire (right)</option>
    </select>
    <select id="limit" title="How many picks to show for each position">
      <option value="3">Top 3</option><option value="5">Top 5</option><option value="10">Top 10</option>
    </select>
    <button id="clear">New draft</button>
    <a id="seen" class="status" href="/api/screen.png" target="_blank" hidden>What it sees</a>
    <span id="status" class="status">Game not detected</span>
  </div>
</header>
<div class="layout">
  <aside>
    <div class="search">
      <input id="q" placeholder="Type a hero, Enter adds to enemies (Shift+Enter: allies)" autocomplete="off">
      <div id="results" class="results" hidden></div>
    </div>

    <div class="team"><h2>Enemies</h2><div id="enemies" class="chips"></div></div>
    <div class="team"><h2>Allies</h2><div id="allies" class="chips"></div></div>
    <div class="team"><h2>Bans</h2><div id="bans" class="chips"></div></div>
  </aside>

  <section class="main">
    <div class="team"><h2>Best picks by position</h2><div id="hint"></div><div id="best" class="cols"></div></div>
    <div class="team"><h2 id="itemsTitle">Item build</h2><div id="items"></div></div>
    <div class="team"><h2>Avoid</h2><div id="avoid"></div></div>
  </section>
</div>
<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let HEROES = [], BY_ID = {};
// What's shown: heroes you added by hand plus what the screen reads right now.
const draft = { enemies: [], allies: [], bans: [] };
const manual = { enemies: [], allies: [], bans: [] };  // added by hand, kept until removed or a new draft
let screen = null;  // latest screen reads: {radiant: [5], dire: [5]}, each {hero_id, score} or null
let screenOn = false;  // the app is reading the screen
let screenEpoch = 0;  // changes around each request that changes the screen reader, so older reads are dropped
let team = null;  // your side, from GSI
let active = 0, matches = [];
const gsiSeen = new Set();  // own picks already auto-added, so removing one sticks
const unsure = new Set();  // screen reads with low confidence, shown with a "?"
const SURE_SCORE = 0.7;
let wasInDraft = false;
let position = null;  // 1-5: the column you picked your hero from, or null to use the hero's main position
let POSITIONS = {};  // 1 -> "Carry", ...
let me = null;  // the hero you picked, for counter items
let drawn = "";  // the draft render() last drew, so polls that change nothing don't redraw

function taken() { return new Set([...draft.enemies, ...draft.allies, ...draft.bans]); }

// Work out the shown draft. Heroes you placed by hand stay where you put them,
// and each team shows at most five, so the screen reads the app is least sure
// of make way for heroes you added.
function rebuild() {
  const mine = $("side").value || team || "radiant";
  const sides = { allies: mine, enemies: mine === "radiant" ? "dire" : "radiant" };
  const placed = new Set([...manual.enemies, ...manual.allies, ...manual.bans]);
  unsure.clear();
  draft.bans = [...manual.bans];
  for (const list of ["allies", "enemies"]) {
    const reads = (screen?.[sides[list]] || []).filter(r => r && !placed.has(r.hero_id));
    reads.forEach(r => placed.add(r.hero_id));
    const room = Math.max(0, 5 - manual[list].length);
    const keep = new Set([...reads].sort((a, b) => b.score - a.score).slice(0, room));
    const shown = reads.filter(r => keep.has(r));  // still in top-bar order
    shown.filter(r => r.score < SURE_SCORE).forEach(r => unsure.add(r.hero_id));
    draft[list] = [...shown.map(r => r.hero_id), ...manual[list]];
  }
  if (me && !draft.allies.includes(me)) { me = null; position = null; }
}

function refresh() {
  rebuild();
  const now = JSON.stringify([draft, [...unsure], me, position]);
  if (now !== drawn) { drawn = now; render(); }
}

function onScreen(id) {
  return !!screen && [...screen.radiant, ...screen.dire].some(r => r?.hero_id === id);
}

async function screenRequest(path, body = {}) {
  screenEpoch++;  // reads already on their way don't know about this yet
  try {
    await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  } catch {}
  screenEpoch++;
}

function add(list, id) {
  if (taken().has(id)) return;
  if (list !== "bans" && manual[list].length >= 5) return;
  manual[list].push(id);
  $("q").value = ""; closeResults(); refresh();
}
function remove(list, id) {
  manual[list] = manual[list].filter(x => x !== id);
  if (list !== "bans" && onScreen(id)) {
    // A wrong read: drop it now and have the app look at that slot again without it.
    for (const side of ["radiant", "dire"]) screen[side] = screen[side].map(r => r?.hero_id === id ? null : r);
    screenRequest("/api/screen/reject", { hero_id: id });
  }
  if (id === me) { me = null; position = null; }
  refresh();
  $("q").focus();  // keep typing heroes without clicking back into the box
}
function setMe(id, pos = null) {
  if (pos) position = pos;
  // Your own hero is certain, so keep it even if the screen read of its slot changes.
  const elsewhere = draft.enemies.includes(id) || draft.bans.includes(id);
  if (!elsewhere && !manual.allies.includes(id) && manual.allies.length < 5) manual.allies.push(id);
  rebuild();
  if (draft.allies.includes(id)) me = id;
  refresh();
}

function chip(list, id) {
  const h = BY_ID[id];
  const el = document.createElement("div");
  el.className = "chip" + (unsure.has(id) ? " unsure" : "") + (id === me ? " me" : "");
  el.title = manual[list].includes(id) ? "Click to remove"
    : (unsure.has(id) ? "Read from the screen, not sure." : "Read from the screen.") +
      " If it's wrong, click it: the app looks at that slot again without it";
  el.innerHTML = `<img class="icon" src="${h.img_url}" alt=""><span>${h.localized_name}</span>`;
  if (list === "allies") {
    const star = document.createElement("span");
    star.className = "star"; star.textContent = "★";
    star.title = id === me ? "Your hero" : "This is my hero";
    star.onclick = e => { e.stopPropagation(); if (id === me) { me = null; position = null; refresh(); } else setMe(id); };
    el.append(star);
  }
  el.onclick = () => remove(list, id);
  return el;
}

function render() {
  for (const list of ["enemies", "allies", "bans"]) {
    $(list).replaceChildren(...draft[list].map(id => chip(list, id)));
  }
  suggest();
  suggestItems();
}

function search(q) {
  q = q.trim().toLowerCase();
  if (!q) return [];
  const t = taken();
  return HEROES.filter(h => !t.has(h.id) && (
    h.localized_name.toLowerCase().includes(q) ||
    h.localized_name.split(/[\s-]/).map(w => w[0]).join("").toLowerCase() === q
  )).slice(0, 8);
}

function closeResults() { $("results").hidden = true; matches = []; }

function showResults() {
  matches = search($("q").value);
  active = 0;
  const box = $("results");
  if (!matches.length) return closeResults();
  box.replaceChildren(...matches.map((h, i) => {
    const el = document.createElement("div");
    el.className = "result" + (i === active ? " active" : "");
    el.innerHTML = `<img class="icon" src="${h.img_url}" alt=""><span>${h.localized_name}</span>`;
    for (const [label, list] of [["Enemy", "enemies"], ["Ally", "allies"], ["Ban", "bans"]]) {
      const b = document.createElement("button");
      b.textContent = label; b.onclick = () => add(list, h.id);
      el.append(b);
    }
    return el;
  }));
  box.hidden = false;
}

$("q").addEventListener("input", showResults);
$("q").addEventListener("keydown", e => {
  if (!matches.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    active = (active + (e.key === "ArrowDown" ? 1 : matches.length - 1)) % matches.length;
    [...$("results").children].forEach((el, i) => el.classList.toggle("active", i === active));
  } else if (e.key === "Enter") {
    add(e.shiftKey ? "allies" : "enemies", matches[active].id);
  } else if (e.key === "Escape") closeResults();
});

function pct(v) { return (v > 0 ? "+" : "") + v.toFixed(1) + "%"; }

function suggRow(s) {
  const el = document.createElement("div");
  el.className = "sugg";
  // Every enemy and ally with its edge, like Dota Plus's "Friends and Foes".
  const edges = (label, rows, key) => rows.length ? `<div class="why">${label} ` +
    rows.map(r => `${r[key]} <span class="${r.advantage >= 0 ? "pos" : "neg"}">${pct(r.advantage)}</span>`).join(", ") +
    "</div>" : "";
  const why = edges("vs", s.reasons, "enemy") + edges("with", s.synergy, "ally");
  el.innerHTML = `<img class="portrait" src="${s.hero.img_url}" alt="">
    <div class="name" title="${s.hero.localized_name}">${s.hero.localized_name}</div>
    <div class="score ${s.score >= 0 ? "pos" : "neg"}">${pct(s.score)}</div>
    <div class="edges">${why || `<div class="why">meta ${pct(s.meta)}</div>`}</div>`;
  return el;
}

let pending = 0;
async function suggest() {
  const ticket = ++pending;
  const body = { ...draft, bracket: $("bracket").value || null, limit: +$("limit").value || 3 };
  const res = await fetch("/api/suggest/positions", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (ticket !== pending || !res.ok) return;
  const data = await res.json();
  $("best").replaceChildren(...data.positions.map(col => {
    const el = document.createElement("div");
    el.className = "col" + (me && position === col.position ? " mine" : "");
    el.innerHTML = `<h3><b>${col.position}</b>${col.name}</h3>`;
    el.append(...col.best.map(s => {
      const row = suggRow(s);
      row.classList.add("pickable");
      row.title = `Click when you pick this hero to play ${col.name}`;
      row.onclick = () => setMe(s.hero.id, col.position);
      return row;
    }));
    if (!col.best.length) el.insertAdjacentHTML("beforeend", '<div class="empty">No heroes left for this position.</div>');
    return el;
  }));
  $("hint").innerHTML = !draft.enemies.length && !draft.allies.length
    ? '<div class="empty">Add enemy or allied heroes to see counters. Showing meta picks for now.</div>' : "";
  $("avoid").replaceChildren(...data.avoid.map(s => suggRow(s)));
}

let pendingItems = 0;
async function suggestItems() {
  const ticket = ++pendingItems;
  const box = $("items");
  if (!me) {
    $("itemsTitle").textContent = "Item build";
    box.innerHTML = '<div class="empty">Click a hero under Best picks once you pick it (its column sets your position), or click ★ on your hero under Allies.</div>';
    return;
  }
  $("itemsTitle").textContent = `Item build for ${BY_ID[me].localized_name}` + (position ? ` (${POSITIONS[position]})` : "");
  const res = await fetch("/api/build", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ hero_id: me, enemies: draft.enemies, position }) });
  if (ticket !== pendingItems || !res.ok) return;
  const data = await res.json();
  const phases = document.createElement("div");
  phases.className = "phases";
  phases.append(...data.phases.map(ph => {
    const el = document.createElement("div");
    el.className = "phase";
    const tiles = ph.items.map(it => {
      const title = `${it.name} (${it.cost})` + (it.minute ? `, usually bought by ${it.minute} min` : "");
      return `<div class="tile${it.answers.length ? " counter" : ""}" title="${title}">
        <img class="item" src="${it.img_url}" alt="${it.name}">${it.count > 1 ? `<span class="n">${it.count}x</span>` : ""}
        <span>${it.cost}</span></div>`;
    }).join("");
    const vs = ph.items.filter(it => it.answers.length).map(it =>
      `<div class="vs"><b>${it.name}</b> vs ${it.answers.map(a => `${a.enemy} (${a.threats.join(", ")})`).join("; ")}</div>`).join("");
    el.innerHTML = `<h3>${ph.label}</h3><div class="tiles">${tiles}</div>${vs}`;
    return el;
  }));
  const rows = [phases];
  if (!draft.enemies.length) rows.push(Object.assign(document.createElement("div"),
    { className: "empty", textContent: "Add enemy heroes to add items that counter them (gold border)." }));
  if (!data.timings) rows.push(Object.assign(document.createElement("div"),
    { className: "empty", textContent: "Using Valve's recommended build only: OpenDota item timings aren't loaded." }));
  box.replaceChildren(...rows);
}

async function pollGame() {
  try {
    const epoch = screenEpoch;
    const g = await (await fetch("/api/game")).json();
    const st = $("status");
    st.textContent = g.game_state ? (g.in_draft ? "Draft in progress" : "In game") : "Game not detected";
    st.classList.toggle("live", !!g.in_draft);
    team = g.team;
    screenOn = !!g.screen;
    if (g.in_draft && !wasInDraft) newDraft();  // a new game's draft has started
    wasInDraft = !!g.in_draft;
    if (g.hero_id && !gsiSeen.has(g.hero_id)) { gsiSeen.add(g.hero_id); setMe(g.hero_id); }
    $("seen").hidden = !g.screen;
    if (g.screen?.error) st.textContent = "Screen read failed: " + g.screen.error;
    if (g.screen && epoch === screenEpoch) screen = g.screen;
    refresh();
  } catch {}
  setTimeout(pollGame, 1000);
}

function newDraft() {
  manual.enemies = []; manual.allies = []; manual.bans = []; me = null; position = null;
  screen = null; gsiSeen.clear();
  if (screenOn) screenRequest("/api/screen/reset");  // the screen reader starts over too
  refresh();
  $("q").focus();
}
$("clear").onclick = newDraft;
$("side").addEventListener("change", () => { store.set("side", $("side").value); refresh(); });
$("bracket").addEventListener("change", () => { store.set("bracket", $("bracket").value); suggest(); });
$("limit").addEventListener("change", () => { store.set("limit", $("limit").value); suggest(); });

(async () => {
  const [heroes, meta] = await Promise.all([fetch("/api/heroes").then(r => r.json()), fetch("/api/meta").then(r => r.json())]);
  HEROES = heroes; BY_ID = Object.fromEntries(heroes.map(h => [h.id, h]));
  $("bracket").innerHTML = '<option value="">All ranks</option>' +
    meta.brackets.map(b => `<option value="${b}">${b[0].toUpperCase() + b.slice(1)}</option>`).join("");
  POSITIONS = meta.positions;
  $("limit").value = store.get("limit", "3");
  if (!$("limit").value) $("limit").value = "3";
  $("bracket").value = store.get("bracket", "");
  $("side").value = store.get("side", "");
  refresh();
  pollGame();
})();
</script>
</body>
</html>
